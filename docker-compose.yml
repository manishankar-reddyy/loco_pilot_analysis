version: "3.8"

services:
  loco-pilot-monitor:
    build: .
    container_name: loco-pilot-monitor
    ports:
      - "8000:8000"
    environment:
      - ENABLE_VLM=1
      - VLM_MODEL_ID=Qwen/Qwen2.5-VL-7B-Instruct
      - YOLO_BATCH_SIZE=32
      - MEDIAPIPE_THREADS=4
      - VLM_MAX_EVENTS=8
      - VLM_IMAGE_SIZE=448
      - VLM_CONTEXT_IMAGES=6
    volumes:
      - ./detections:/app/detections    # persist evidence images and PDFs
      - ./profiles:/app/profiles        # persist analysis profile JSONs
      - hf_model_cache:/hf_cache        # persist downloaded HuggingFace models (~15 GB)
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    shm_size: "2gb"                     # shared memory for PyTorch DataLoader workers

volumes:
  hf_model_cache:
